<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="poster-wrap">
    <img src="background.jpg" alt="Lakme Salon Meerut — Rajan Kunj Diwali Festival, discounts up to 30% off" class="banner-image" />
    <div class="card" id="formCard">
    <h1>Welcome! Complete Your Registration.</h1>
    <p class="subtitle">Fill in your details below to get your unique code.</p>

    <form id="regForm" autocomplete="off">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" placeholder="e.g. Jordan Smith" required maxlength="100" />

      <label for="mobileNumber">Mobile Number</label>
      <div class="mobile-row">
        <select id="countryCode" name="countryCode">
          <option value="+91" selected>🇮🇳 +91</option>
          <option value="+1">🇺🇸 +1</option>
          <option value="+44">🇬🇧 +44</option>
          <option value="+61">🇦🇺 +61</option>
          <option value="+971">🇦🇪 +971</option>
          <option value="+65">🇸🇬 +65</option>
          <option value="+49">🇩🇪 +49</option>
          <option value="+33">🇫🇷 +33</option>
          <option value="+81">🇯🇵 +81</option>
          <option value="+86">🇨🇳 +86</option>
          <option value="+27">🇿🇦 +27</option>
          <option value="+55">🇧🇷 +55</option>
          <option value="+966">🇸🇦 +966</option>
          <option value="+92">🇵🇰 +92</option>
          <option value="+880">🇧🇩 +880</option>
        </select>
        <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="10-digit number" required maxlength="14" inputmode="numeric" />
      </div>

      <div class="error" id="errorBox"></div>

      <button type="submit" id="submitBtn">
        <span id="submitLabel">Generate My Discount Code</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>

    <div class="result" id="resultBox">
      <h2>Registration Successful!</h2>
      <p>Your unique code:</p>
      <div class="code-box" id="codeDisplay"></div>
      <p class="hint">Please save this code for future reference.</p>
      <button type="button" class="secondary" id="copyBtn" style="margin-top:16px;">Copy Code</button>
      <p class="hint" id="copiedHint" style="display:none;">Copied!</p>
    </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
